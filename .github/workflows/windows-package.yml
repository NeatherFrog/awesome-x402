name: Windows portable package

on:
  push:
    branches: [main]
    paths:
      - 'propdesk/**'
      - 'static/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'launch.py'
      - 'START-*'
      - 'RELEASE.json'
      - '.gitattributes'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TRADING_AUTOPILOT_DEFAULT: '0'
      TRADING_CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test application
        run: python -X utf8 scripts/ci_check.py tests
      - name: Check browser script
        run: node --check static/app.js
      - name: Build official Python portable package
        run: python -X utf8 scripts/ci_check.py build
      - name: Run actual Windows package and update
        run: python -X utf8 scripts/ci_check.py smoke
      - name: Retain tested package
        uses: actions/upload-artifact@v4
        with:
          name: prop-lab-windows-x64
          path: |
            dist/PROP-LAB-Windows-x64-*.zip
            dist/PROP-LAB-Windows-x64-*.zip.sha256
            dist/windows-validation.json
          retention-days: 30
      - name: Publish tested package for direct download
        run: python -X utf8 scripts/ci_check.py publish
